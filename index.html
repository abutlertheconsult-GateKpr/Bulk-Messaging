<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WA Sender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #25D366;
    --green-dark: #128C7E;
    --green-light: #DCF8C6;
    --bg: #0a0f0d;
    --bg2: #111a15;
    --bg3: #172010;
    --surface: #1a2a1e;
    --surface2: #223028;
    --border: rgba(37,211,102,0.15);
    --border2: rgba(37,211,102,0.3);
    --text: #e8f5ec;
    --text2: #8aad94;
    --text3: #4a7055;
    --radius: 14px;
    --radius-sm: 8px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  body {
    padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 24px 20px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 0.5px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  .logo {
    width: 38px;
    height: 38px;
    background: var(--green);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo svg { width: 22px; height: 22px; fill: #fff; }

  .header-text h1 {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .header-text p {
    font-size: 12px;
    color: var(--text2);
    margin-top: 1px;
  }

  .main {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .field-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 8px;
    display: block;
  }

  textarea {
    width: 100%;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    resize: none;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  textarea:focus {
    border-color: var(--border2);
  }

  textarea::placeholder { color: var(--text3); }

  #msg { min-height: 100px; }
  #nums { min-height: 120px; font-family: 'DM Mono', monospace; font-size: 13px; }

  .hint {
    font-size: 11px;
    color: var(--text3);
    margin-top: 6px;
    padding-left: 2px;
  }

  .gen-btn {
    width: 100%;
    padding: 16px;
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: -0.2px;
    transition: background 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .gen-btn:active { background: var(--green-dark); transform: scale(0.98); }

  #results { display: none; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 4px;
  }

  .stat-box {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 8px;
    text-align: center;
  }

  .stat-n {
    font-size: 24px;
    font-weight: 600;
    color: var(--green);
    line-height: 1;
  }

  .stat-l {
    font-size: 11px;
    color: var(--text3);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .prog-wrap {
    background: var(--surface);
    border-radius: 99px;
    height: 4px;
    overflow: hidden;
    margin: 12px 0 20px;
  }

  .prog-bar {
    height: 4px;
    background: var(--green);
    border-radius: 99px;
    width: 0%;
    transition: width 0.4s ease;
  }

  .results-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 12px;
  }

  .contact-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    transition: opacity 0.3s, border-color 0.3s;
  }

  .contact-card.sent {
    opacity: 0.45;
    border-color: rgba(37,211,102,0.07);
  }

  .contact-num {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text2);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .contact-num .flag {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: var(--text3);
    display: block;
    margin-bottom: 2px;
  }

  .btns { display: flex; gap: 8px; flex-shrink: 0; }

  .mark-btn {
    background: transparent;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-sm);
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    padding: 7px 10px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }

  .mark-btn.done {
    color: var(--green);
    border-color: rgba(37,211,102,0.4);
    background: rgba(37,211,102,0.07);
  }

  .open-btn {
    background: var(--green);
    border: none;
    border-radius: var(--radius-sm);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .open-btn:active { background: var(--green-dark); }

  .send-icon { width: 14px; height: 14px; fill: #fff; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text3);
    font-size: 14px;
  }

  .reset-btn {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    margin-top: 8px;
    transition: border-color 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .reset-btn:active { color: var(--text); border-color: var(--border2); }

  .divider {
    height: 0.5px;
    background: var(--border);
    margin: 4px 0;
  }

  /* All-sent celebration */
  .all-done {
    text-align: center;
    padding: 20px;
    background: rgba(37,211,102,0.07);
    border: 0.5px solid rgba(37,211,102,0.3);
    border-radius: var(--radius);
    color: var(--green);
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 12px;
    display: none;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 2C8.268 2 2 8.268 2 16c0 2.478.672 4.8 1.84 6.8L2 30l7.4-1.82A13.93 13.93 0 0016 30c7.732 0 14-6.268 14-14S23.732 2 16 2zm7.2 19.4c-.3.84-1.76 1.56-2.44 1.66-.62.09-1.4.13-2.26-.14-.52-.17-1.18-.39-2.04-.76-3.58-1.55-5.92-5.16-6.1-5.4-.18-.24-1.48-1.96-1.48-3.74s.94-2.66 1.28-3.02c.3-.32.66-.4.88-.4h.63c.2 0 .47-.08.74.56.28.66.96 2.34 1.04 2.52.08.18.14.4.02.64-.12.24-.18.38-.36.58-.18.2-.38.45-.54.6-.18.18-.36.36-.16.72.2.34.9 1.48 1.92 2.4 1.32 1.18 2.44 1.54 2.78 1.72.34.18.54.16.74-.1.2-.24.86-1 1.08-1.34.22-.34.44-.28.74-.16.3.12 1.92.9 2.26 1.06.32.16.54.24.62.38.08.14.08.8-.22 1.62z"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>WA Bulk Sender</h1>
      <p>Send one message to many — individually</p>
    </div>
  </header>

  <div class="main">
    <div>
      <span class="field-label">Your message</span>
      <textarea id="msg" placeholder="Type your message here..."></textarea>
    </div>

    <div>
      <span class="field-label">Phone numbers</span>
      <textarea id="nums" placeholder="12015550123&#10;12015550124&#10;12015550125"></textarea>
      <p class="hint">One per line · Include country code · No dashes or spaces · US example: 12015550123</p>
    </div>

    <button class="gen-btn" onclick="generate()">
      Generate Send Links
    </button>

    <div id="results">
      <div class="divider"></div>

      <div class="stats-row">
        <div class="stat-box"><div class="stat-n" id="total-n">0</div><div class="stat-l">Total</div></div>
        <div class="stat-box"><div class="stat-n" id="sent-n">0</div><div class="stat-l">Sent</div></div>
        <div class="stat-box"><div class="stat-n" id="left-n">0</div><div class="stat-l">Left</div></div>
      </div>
      <div class="prog-wrap"><div class="prog-bar" id="prog"></div></div>

      <div class="all-done" id="all-done">🎉 All messages sent!</div>

      <div class="results-label">Tap Open → hit Send in WhatsApp</div>

      <div id="cards"></div>

      <button class="reset-btn" onclick="reset()">Start over</button>
    </div>
  </div>

</div>

<script>
  let sentSet = new Set();
  let total = 0;

  function generate() {
    const msg = document.getElementById('msg').value.trim();
    const raw = document.getElementById('nums').value.trim();

    if (!msg || !raw) {
      alert('Please enter both a message and at least one phone number.');
      return;
    }

    const nums = raw.split('\n').map(n => n.replace(/\D/g, '')).filter(n => n.length >= 7);
    if (!nums.length) {
      alert('No valid numbers found. Make sure each number includes the country code.');
      return;
    }

    sentSet = new Set();
    total = nums.length;
    const encoded = encodeURIComponent(msg);

    updateStats();

    const cardsEl = document.getElementById('cards');
    cardsEl.innerHTML = '';

    nums.forEach((num, i) => {
      const url = `https://wa.me/${num}?text=${encoded}`;
      const card = document.createElement('div');
      card.className = 'contact-card';
      card.id = `card-${i}`;
      card.innerHTML = `
        <div class="contact-num">${num}</div>
        <div class="btns">
          <button class="mark-btn" id="done-${i}" onclick="markSent(${i})">✓ Mark sent</button>
          <a class="open-btn" href="${url}" target="_blank" onclick="schedMark(${i})">
            <svg class="send-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            Open
          </a>
        </div>
      `;
      cardsEl.appendChild(card);
    });

    document.getElementById('results').style.display = 'block';
    document.getElementById('all-done').style.display = 'none';
    document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function schedMark(i) {
    setTimeout(() => markSent(i), 1800);
  }

  function markSent(i) {
    if (sentSet.has(i)) return;
    sentSet.add(i);
    const btn = document.getElementById(`done-${i}`);
    const card = document.getElementById(`card-${i}`);
    if (btn) { btn.textContent = '✓ Sent'; btn.classList.add('done'); }
    if (card) { card.classList.add('sent'); }
    updateStats();
    if (sentSet.size === total) {
      document.getElementById('all-done').style.display = 'block';
    }
  }

  function updateStats() {
    const sent = sentSet.size;
    const left = total - sent;
    document.getElementById('total-n').textContent = total;
    document.getElementById('sent-n').textContent = sent;
    document.getElementById('left-n').textContent = left;
    document.getElementById('prog').style.width = total ? Math.round((sent / total) * 100) + '%' : '0%';
  }

  function reset() {
    document.getElementById('results').style.display = 'none';
    document.getElementById('msg').value = '';
    document.getElementById('nums').value = '';
    document.getElementById('msg').focus();
    sentSet = new Set();
    total = 0;
  }
</script>
</body>
</html>
